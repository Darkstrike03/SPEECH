services:
  - type: web
    name: speech-to-text-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python prefetch_model.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: WHISPER_MODEL_SIZE
        value: tiny
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: MAX_AUDIO_SECONDS
        value: "300"
      - key: ALLOWED_ORIGINS
        value: http://localhost:5500,http://127.0.0.1:5500
